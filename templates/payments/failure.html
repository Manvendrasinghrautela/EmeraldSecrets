{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger">
        <h2>✗ Payment Failed</h2>
        <p>Unfortunately, your payment could not be processed.</p>
    </div>
    
    {% if order %}
    <p>Order #{{ order.id }} - Please try again.</p>
    <a href="{% url 'payments:initiate_payment' %}" class="btn btn-primary">Retry Payment</a>
    {% endif %}
    
    <a href="{% url 'products:home' %}" class="btn btn-secondary">Continue Shopping</a>
</div>
{% endblock %}

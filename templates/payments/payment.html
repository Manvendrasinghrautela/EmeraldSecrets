{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Complete Payment</h2>
    <p>Order #{{ order.id }} - Amount: ₹{{ order.total_amount }}</p>
    
    <button id="rzp-button" class="btn btn-primary btn-lg">Pay ₹{{ order.total_amount }}</button>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ amount }}",
    "currency": "{{ currency }}",
    "name": "Emerald Secrets",
    "description": "Order #{{ order.id }}",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        // Submit payment details to callback
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '{% url "payments:payment_callback" %}';
        
        var fields = {
            'razorpay_payment_id': response.razorpay_payment_id,
            'razorpay_order_id': response.razorpay_order_id,
            'razorpay_signature': response.razorpay_signature
        };
        
        for(var key in fields) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        
        document.body.appendChild(form);
        form.submit();
    },
    "prefill": {
        "name": "{{ user_name }}",
        "email": "{{ user_email }}",
        "contact": "{{ user_phone }}"
    },
    "theme": {
        "color": "#2D7A6E"
    }
};

var rzp = new Razorpay(options);
document.getElementById('rzp-button').onclick = function(e){
    rzp.open();
    e.preventDefault();
}
</script>
{% endblock %}

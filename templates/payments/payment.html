{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h3>Complete Your Payment</h3>
                    <p class="mt-3">Order #{{ order.order_number }}</p>
                    <h2 class="text-primary">₹{{ order.total|floatformat:2 }}</h2>
                    
                    <button id="rzp-button" class="btn btn-lg btn-success mt-4">
                        Pay Now with Razorpay
                    </button>
                    
                    <p class="mt-3 text-muted">
                        <small>Secured by Razorpay</small>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ amount }}",
    "currency": "{{ currency }}",
    "name": "Emerald Secrets",
    "description": "Order #{{ order.order_number }}",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        // Create form and submit
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '{% url "orders:payment_callback" %}';
        
        var fields = {
            'razorpay_payment_id': response.razorpay_payment_id,
            'razorpay_order_id': response.razorpay_order_id,
            'razorpay_signature': response.razorpay_signature
        };
        
        for(var key in fields) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }
        
        document.body.appendChild(form);
        form.submit();
    },
    "prefill": {
        "name": "{{ user_name }}",
        "email": "{{ user_email }}",
        "contact": "{{ user_phone }}"
    },
    "theme": {
        "color": "#2D7A6E"
    }
};

var rzp = new Razorpay(options);

// Auto-open payment on page load
document.getElementById('rzp-button').onclick = function(e){
    rzp.open();
    e.preventDefault();
}

// Optionally auto-open on page load
// rzp.open();
</script>
{% endblock %}
